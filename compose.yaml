services:
  web:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      DATABASE_PATH: ${DATABASE_PATH:-/data/guandan.sqlite}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - guandan-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  guandan-data:
