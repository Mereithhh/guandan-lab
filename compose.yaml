services:
  web:
    build: .
    image: guandan-lab:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env.local
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - guandan-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  guandan-data:
