name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: Include the exact action and result. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Reproduction, description: Give the smallest reliable sequence and seed if shown. }
    validations: { required: true }
  - type: input
    attributes: { label: Browser and device }
  - type: textarea
    attributes: { label: Additional evidence, description: Screenshots must not contain private data or API keys. }
